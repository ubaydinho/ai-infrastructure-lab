{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Values.tenant.name }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Tanpa blok ini, DNS mati dan semuanya rusak dengan cara membingungkan —
# persis yang kamu buktikan sendiri di Sesi 5 (nslookup timeout, bukan NXDOMAIN).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ .Values.tenant.name }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- end }}
