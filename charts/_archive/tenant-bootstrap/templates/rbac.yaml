apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.tenant.name }}-user
  namespace: {{ .Values.tenant.name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.tenant.name }}-viewer
  namespace: {{ .Values.tenant.name }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, configmaps, persistentvolumeclaims]
    verbs: {{ .Values.rbac.verbs | toJson }}
  - apiGroups: [""]
    resources: [resourcequotas]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.tenant.name }}-viewer
  namespace: {{ .Values.tenant.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.tenant.name }}-user
    namespace: {{ .Values.tenant.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.tenant.name }}-viewer
