# Ditulis mengikuti sintaks plugin helm-unittest (https://github.com/helm-unittest/helm-unittest),
# TAPI BELUM PERNAH DIJALANKAN — sandbox penulisnya tidak berhasil memasang binary helm hari ini.
# Jalankan sendiri sebelum dipercaya:
#   helm plugin install https://github.com/helm-unittest/helm-unittest
#   helm unittest .
suite: tenant-bootstrap — perilaku default dan per-tier
templates:
  - namespace.yaml
  - resourcequota.yaml
  - limitrange.yaml
  - rbac.yaml
  - networkpolicy.yaml
tests:

  - it: namespace memakai nama dan label tier dari values
    template: namespace.yaml
    asserts:
      - isKind:
          of: Namespace
      - equal:
          path: metadata.name
          value: tenant-a
      - equal:
          path: metadata.labels.tier
          value: small

  - it: tier default (small) menghasilkan quota 1 GPU dan 30 pod
    template: resourcequota.yaml
    asserts:
      - equal:
          path: spec.hard["requests.nvidia.com/gpu"]
          value: "1"
      - equal:
          path: spec.hard.pods
          value: "30"

  - it: tier medium menghasilkan quota 2 GPU
    template: resourcequota.yaml
    set:
      tenant.tier: medium
    asserts:
      - equal:
          path: spec.hard["requests.nvidia.com/gpu"]
          value: "2"
      - equal:
          path: spec.hard["requests.memory"]
          value: "256Gi"

  - it: tier dedicated menghasilkan quota 4 GPU dan memory 2Ti
    template: resourcequota.yaml
    set:
      tenant.tier: dedicated
    asserts:
      - equal:
          path: spec.hard["requests.nvidia.com/gpu"]
          value: "4"
      - equal:
          path: spec.hard["requests.memory"]
          value: "2Ti"

  - it: tier yang tidak ada di values.yaml membuat render gagal, bukan diam-diam kosong
    template: resourcequota.yaml
    set:
      tenant.tier: tidak-ada
    asserts:
      - failedTemplate:
          errorMessage: "nil pointer evaluating interface {}.gpu"

  - it: LimitRange mengisi default 500m/1Gi sesuai values, terlepas dari tier
    template: limitrange.yaml
    asserts:
      - equal:
          path: spec.limits[0].defaultRequest.cpu
          value: "500m"
      - equal:
          path: spec.limits[0].defaultRequest.memory
          value: "1Gi"

  - it: Role default TIDAK mengizinkan delete
    template: rbac.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: Role
      - notContains:
          path: rules[0].verbs
          content: delete

  - it: NetworkPolicy default-deny dan allow-dns keduanya dirender saat enabled
    template: networkpolicy.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: default-deny-all
          documentIndex: 0
      - equal:
          path: metadata.name
          value: allow-dns
          documentIndex: 1

  - it: NetworkPolicy tidak dirender sama sekali saat dimatikan
    template: networkpolicy.yaml
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
