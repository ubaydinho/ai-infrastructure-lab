# LimitRange = nilai default dan batas PER CONTAINER di satu namespace.
# ResourceQuota mengatur totalnya, LimitRange mengatur satuannya.
#
# Fungsi yang paling sering tidak disadari: 'defaultRequest' mengisi
# pod yang lupa menulis resources, sehingga pod itu lolos ResourceQuota.
# Tanpa LimitRange, pod tanpa resources DITOLAK oleh quota.
apiVersion: v1
kind: LimitRange
metadata:
  name: limits-tenant-a
  namespace: tenant-a
spec:
  limits:
    - type: Container
      defaultRequest:                 # dipakai kalau pod tidak menulis requests
        cpu: 500m
        memory: 1Gi
      default:                        # dipakai kalau pod tidak menulis limits
        cpu: "1"
        memory: 2Gi
      min:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "16"
        memory: 16Gi
