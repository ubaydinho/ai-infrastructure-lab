# Tiga objek untuk satu tujuan: siapa boleh melakukan apa.
#   ServiceAccount = identitas
#   Role           = daftar izin, berlaku dalam SATU namespace
#   RoleBinding    = menempelkan Role ke identitas
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-a-user
  namespace: tenant-a
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-a-viewer
  namespace: tenant-a
rules:
  - apiGroups: [""]                   # "" = core API group (pod, service, dll)
    resources: [pods, pods/log, services, configmaps, persistentvolumeclaims]
    verbs: [get, list, watch]         # baca saja, tidak boleh create/delete
  - apiGroups: [""]
    resources: [resourcequotas]
    verbs: [get, list]                # biar tenant bisa lihat jatahnya sendiri
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-a-viewer
  namespace: tenant-a
subjects:
  - kind: ServiceAccount
    name: tenant-a-user
    namespace: tenant-a
roleRef:
  apiGroup: rbac.authorization.k8s.io  # perhatikan: apiGroup TUNGGAL di sini
  kind: Role
  name: tenant-a-viewer
