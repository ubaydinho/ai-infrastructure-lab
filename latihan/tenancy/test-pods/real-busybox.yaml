# Pod SUNGGUHAN (bukan KWOK) untuk menguji NetworkPolicy.
# Mendarat di node k3d asli, makan sekitar 5 MB.
apiVersion: v1
kind: Pod
metadata:
  name: real-busybox
  namespace: tenant-a
spec:
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits:   { cpu: 200m, memory: 256Mi }
