# Pod TANPA blok resources sama sekali. Untuk menguji LimitRange.
# Sebelum LimitRange ada: ditolak quota. Sesudah: diterima, diisi default.
apiVersion: v1
kind: Pod
metadata:
  name: tanpa-resources
  namespace: tenant-a
spec:
  nodeSelector: { type: kwok }
  tolerations:
    - { key: kwok.x-k8s.io/node, operator: Equal, value: fake, effect: NoSchedule }
  containers:
    - name: polos
      image: fake-image:latest
