# Pod batch palsu, 1 GPU. Perbanyak dengan --dry-run + sed untuk mengisi 8 slot.
apiVersion: v1
kind: Pod
metadata:
  name: batch-1
  labels: { team: riset, tier: batch, sim: "true" }
spec:
  priorityClassName: lab-batch
  nodeSelector: { type: kwok }
  tolerations:
    - key: kwok.x-k8s.io/node
      operator: Equal
      value: fake
      effect: NoSchedule
  containers:
    - name: trainer
      image: fake-image:latest
      resources:
        # Extended resource wajib requests == limits. Tidak ada overcommit GPU.
        requests: { cpu: "8", memory: 64Gi, nvidia.com/gpu: "1" }
        limits:   { cpu: "8", memory: 64Gi, nvidia.com/gpu: "1" }
