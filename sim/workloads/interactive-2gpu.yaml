# Pod interaktif palsu, 2 GPU. Inilah yang akan merebut slot batch.
apiVersion: v1
kind: Pod
metadata:
  name: interactive-1
  labels: { team: riset, tier: interactive, sim: "true" }
spec:
  priorityClassName: lab-interactive
  nodeSelector: { type: kwok }
  tolerations:
    - key: kwok.x-k8s.io/node
      operator: Equal
      value: fake
      effect: NoSchedule
  containers:
    - name: server
      image: fake-image:latest
      resources:
        # Extended resource wajib requests == limits. Tidak ada overcommit GPU.
        requests: { cpu: "8", memory: 64Gi, nvidia.com/gpu: "2" }
        limits:   { cpu: "8", memory: 64Gi, nvidia.com/gpu: "2" }
